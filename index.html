<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#9E1F36" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>第二课堂情报站</title>
<style>
  :root{
    --sjtu-red:#9E1F36;
    --sjtu-red-dark:#7d1829;
    --sjtu-red-light:#c8324b;
    --ink:#1f2328;
    --ink-2:#5b6472;
    --ink-3:#8b95a5;
    --line:#eceef1;
    --bg:#f4f5f7;
    --card:#ffffff;
    --ok:#1a7f4b;
    --warn:#c2680a;
    --full:#8b95a5;
    --none:#2b6cb0;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- 顶部 ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(135deg,var(--sjtu-red) 0%,var(--sjtu-red-dark) 100%);
    color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;
    box-shadow:0 2px 12px rgba(158,31,54,.28);
  }
  .hi{display:flex;align-items:center;gap:10px}
  .hi h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
  .hi .dot{width:8px;height:8px;border-radius:50%;background:#7ee2a8;box-shadow:0 0 0 3px rgba(126,226,168,.25);flex:none}
  .sub{margin-top:5px;font-size:12px;opacity:.86;display:flex;flex-wrap:wrap;gap:4px 10px}
  .sub b{font-weight:600}
  /* ---------- 登录过期横幅 ---------- */
  #expired{display:none;background:#fff4e5;border:1px solid #ffd8a8;color:#8a4b00;margin:10px 12px 0;padding:11px 13px;border-radius:12px;font-size:13px}
  #expired.show{display:block}
  #expired b{display:block;margin-bottom:3px;font-size:13.5px}
  #expired code{background:#fff;border:1px solid #ffd8a8;border-radius:5px;padding:1px 5px;font-size:12px}
  /* ---------- 统计 ---------- */
  .stats{display:flex;gap:8px;padding:12px 12px 2px}
  .stat{flex:1;background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-size:20px;font-weight:700;line-height:1.15;color:var(--sjtu-red)}
  .stat .n.g{color:var(--ok)}.stat .n.w{color:var(--warn)}.stat .n.f{color:var(--full)}
  .stat .t{font-size:11px;color:var(--ink-3);margin-top:2px}
  /* ---------- 筛选 ---------- */
  nav{display:flex;gap:8px;padding:12px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    font-size:13px;padding:7px 15px;border-radius:999px;font-family:inherit;cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  nav button.on{background:var(--sjtu-red);border-color:var(--sjtu-red);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(158,31,54,.25)}
  nav button span{opacity:.7;font-size:12px}
  /* ---------- 列表 ---------- */
  main{padding:0 12px 26px;display:flex;flex-direction:column;gap:11px}
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:13px 14px;display:flex;gap:12px;position:relative;overflow:hidden;
    animation:in .28s ease both;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card.full{opacity:.72}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sjtu-red)}
  .card.full::before,.card.closed::before{background:var(--full)}
  .card.tight::before{background:var(--warn)}
  .card.none::before{background:var(--none)}
  .date{
    flex:none;width:48px;text-align:center;border-right:1px solid var(--line);padding-right:10px;
    display:flex;flex-direction:column;justify-content:flex-start;
  }
  .date .d{font-size:21px;font-weight:700;color:var(--sjtu-red);line-height:1.1}
  .date .m{font-size:11px;color:var(--ink-3)}
  .body{flex:1;min-width:0}
  .title{font-size:15px;font-weight:650;margin:0 0 6px;line-height:1.35;word-break:break-word}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
  .tag{font-size:11px;padding:1.5px 7px;border-radius:5px;background:#f1f3f6;color:var(--ink-2);white-space:nowrap}
  .tag.open{background:#e7f6ee;color:var(--ok)}
  .tag.tight{background:#fdf1e3;color:var(--warn)}
  .tag.full{background:#f0f1f4;color:var(--full)}
  .tag.none{background:#e8f1fa;color:var(--none)}
  .tag.closed{background:#eef0f3;color:#7c8798}
  .tag.m{background:#f5f0fb;color:#6b3fa0}
  .tag.labor{background:#e3f5ec;color:#0f7a45;font-weight:600}
  .tag.mine{background:#fde8ef;color:#b3123f;font-weight:700;border:1px solid #f7c6d6}
  .meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
  .meta i{font-style:normal;color:var(--ink-3);display:inline-block;min-width:30px}
  .desc{font-size:12.5px;color:var(--ink-3);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);word-break:break-word}
  .quota{margin-top:9px}
  .quota .bar{height:5px;border-radius:3px;background:#eef0f3;overflow:hidden}
  .quota .bar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .4s}
  .quota .bar i.mid{background:var(--warn)}
  .quota .bar i.hot{background:#d64545}
  .quota .txt{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
  .quota .txt b{color:var(--ink-2);font-weight:600}
  .go{
    display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12.5px;font-weight:600;
    color:var(--sjtu-red);text-decoration:none;border:1px solid rgba(158,31,54,.28);
    padding:5px 12px;border-radius:8px;background:rgba(158,31,54,.04);
  }
  .go:active{background:rgba(158,31,54,.12)}
  .empty{text-align:center;color:var(--ink-3);font-size:13.5px;padding:46px 10px}
  .empty .big{font-size:34px;margin-bottom:8px;opacity:.5}
  footer{padding:6px 18px 30px;text-align:center;font-size:11.5px;color:var(--ink-3);line-height:1.8}
  footer a{color:var(--ink-3)}
  /* ---------- 密码锁 ---------- */
  body.locked > header,body.locked > #expired,body.locked > .stats,
  body.locked > nav,body.locked > main,body.locked > footer{display:none !important}
  #lock{display:none;position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#9E1F36,#6d1524);
    align-items:center;justify-content:center;padding:24px}
  #lock.show{display:flex}
  #lock.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .lockbox{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:22px 20px 20px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
  .lockbox .ico{font-size:34px;line-height:1;margin-bottom:8px}
  .lockbox h2{margin:0 0 4px;font-size:17px;color:var(--ink)}
  .lockbox p{margin:0 0 14px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
  .lockbox input{width:100%;box-sizing:border-box;font-size:15px;padding:11px 13px;border:1px solid #dcdfe4;
    border-radius:11px;font-family:inherit;outline:none;text-align:center;letter-spacing:.5px}
  .lockbox input:focus{border-color:var(--sjtu-red);box-shadow:0 0 0 3px rgba(158,31,54,.12)}
  .lockbox button{width:100%;margin-top:11px;padding:11px;border:0;border-radius:11px;background:var(--sjtu-red);
    color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .lockbox button:active{background:var(--sjtu-red-dark)}
  .lockbox .err{color:#c0392b;font-size:12.5px;min-height:17px;margin-top:9px}
  .lockbox .tip{color:var(--ink-3);font-size:12.5px;min-height:17px;margin-top:9px}
  .lockbox .hintline{margin-top:12px;font-size:11px;color:var(--ink-3);line-height:1.6}
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <div class="ico">🔒</div>
    <h2>第二课堂情报站</h2>
    <p>这个页面是加密的，请输入密码查看活动。</p>
    <input id="lockPw" type="password" placeholder="密码" autocomplete="current-password" />
    <button id="lockBtn">解锁</button>
    <div class="tip" id="lockTip"></div>
    <div class="err" id="lockErr"></div>
    <div class="hintline">密码只在本机浏览器里校验，不会发送到任何服务器。</div>
  </div>
</div>

<header>
  <div class="hi"><span class="dot"></span><h1>第二课堂情报站</h1></div>
  <div class="sub">
    <span>更新于 <b id="updatedAt">—</b></span>
    <span id="srcTip">数据源 activity.sjtu.edu.cn/dekt</span>
  </div>
</header>

<div id="expired">
  <b>⚠️ 登录态已过期，数据可能不是最新</b>
  请在电脑上打开 Edge 重新登录第二课堂，然后运行 <code>抓取.cmd</code>。
</div>

<div class="stats">
  <div class="stat"><div class="n" id="s-all">0</div><div class="t">全部活动</div></div>
  <div class="stat"><div class="n g" id="s-open">0</div><div class="t">可报名</div></div>
  <div class="stat"><div class="n w" id="s-tight">0</div><div class="t">名额紧张</div></div>
  <div class="stat"><div class="n f" id="s-full">0</div><div class="t">已满</div></div>
</div>

<nav id="filters"></nav>
<main id="list"></main>
<footer>
  <div>数据来自上海交通大学校园活动平台 · 需校内登录才可报名</div>
  <div>本页仅作信息聚合，一切以官网为准</div>
</footer>

    if (!(window.crypto && crypto.subtle)) return Promise.reject(new Error('需要 https 才能解锁'));
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64buf(env.salt), iterations:env.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM', iv:b64buf(env.iv)}, key, b64buf(env.ct));
    }).then(function(pt){
      return JSON.parse(new TextDecoder().decode(pt));
    });
  }
  function requirePassword(env){
    var lock = document.getElementById('lock');
    var inp  = document.getElementById('lockPw');
    var btn  = document.getElementById('lockBtn');
    var tip  = document.getElementById('lockTip');
    var err  = document.getElementById('lockErr');
    lock.classList.add('show');
    document.body.classList.add('locked');

    function tryPw(pw){
      if (!pw) return;
      err.textContent = '';
      tip.textContent = '正在解锁…';
      unlock(env, pw).then(function(data){
        try { localStorage.setItem('dekt-pw', pw); } catch(e){}
        lock.classList.remove('show');
        document.body.classList.remove('locked');
        start(data);
      }).catch(function(e){
        tip.textContent = '';
        err.textContent = (e && /https/.test(e.message)) ? e.message : '密码不对，再试一次';
        inp.value = ''; inp.focus();
        lock.classList.add('shake');
        setTimeout(function(){ lock.classList.remove('shake'); }, 450);
      });
    }
    btn.onclick = function(){ tryPw(inp.value); };
    inp.onkeydown = function(e){ if (e.key === 'Enter') tryPw(inp.value); };
    var saved = null;
    try { saved = localStorage.getItem('dekt-pw'); } catch(e){}
    if (saved) { inp.value = saved; tryPw(saved); }
    else setTimeout(function(){ inp.focus(); }, 250);
  }

  // ---------- 正常渲染 ----------
  function start(D){
  var A = Array.isArray(D.activities) ? D.activities : [];

  var STATUS = {
    open:{t:'可报名',c:'open'},
    tight:{t:'名额紧张',c:'tight'},
    full:{t:'已满',c:'full'},
    none:{t:'报名未开始',c:'none'},
    closed:{t:'报名已截止',c:'closed'}
  };
  var METHOD = {1:'审核录取',2:'线下报名',3:'先到先得',4:'无需报名',5:'随机录取',6:'跳转其他报名'};
  var FILTERS = [
    {k:'all',   t:'全部'},
    {k:'mine',  t:'已报名'},
    {k:'open',  t:'可报名'},
    {k:'tight', t:'名额紧张'},
    {k:'labor', t:'计劳动学时'},
    {k:'none',  t:'未开始'},
    {k:'full',  t:'已满'},
    {k:'closed',t:'已截止'}
  ];

  document.getElementById('updatedAt').textContent = D.updatedAt || '—';
  if (D.loginExpired) document.getElementById('expired').classList.add('show');

  var cnt = {all:A.length, open:0, tight:0, full:0, none:0, other:0, labor:0, mine:0};
  A.forEach(function(a){
    if (cnt[a.status] === undefined) cnt.other++; else cnt[a.status]++;
    if (a.labor && a.labor.counted) cnt.labor++;
    if (a.signedUp) cnt.mine++;
  });
  cnt.all = A.length;
  document.getElementById('s-all').textContent   = cnt.all;
  document.getElementById('s-open').textContent  = cnt.open;
  document.getElementById('s-tight').textContent = cnt.tight;
  document.getElementById('s-full').textContent  = cnt.full;

  // 筛选按钮
  var nav = document.getElementById('filters');
  FILTERS.forEach(function(f){
    var n = f.k === 'all' ? cnt.all : (cnt[f.k]||0);
    var b = document.createElement('button');
    b.dataset.k = f.k;
    b.innerHTML = f.t + ' <span>' + n + '</span>';
    if (f.k === 'all') b.classList.add('on');
    b.onclick = function(){
      [].forEach.call(nav.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      render(f.k);
    };
    nav.appendChild(b);
  });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function render(k){
    var list = document.getElementById('list');
    var items = k === 'all' ? A
      : k === 'labor' ? A.filter(function(a){ return a.labor && a.labor.counted; })
      : k === 'mine' ? A.filter(function(a){ return a.signedUp; })
      : A.filter(function(a){ return a.status === k; });
    if (!items.length){
      list.innerHTML = '<div class="empty"><div class="big">'+(k==='mine'?'📝':'🗓️')+'</div>'
        + (k === 'mine' ? '你还没有报名看板里的活动' : '暂时没有符合条件的活动') + '<br>（或数据尚未抓取）</div>';
      return;
    }
    list.innerHTML = items.map(function(a, i){
      var st = STATUS[a.status] || {t:a.status||'—', c:''};
      var mm = String(a.date||'').match(/(\d+)\s*月/);
      var dd = String(a.date||'').match(/(\d+)\s*日/);
      var mineHtml = a.signedUp ? '<span class="tag mine">✓ 已报名</span>' : '';
      var laborHtml = (a.labor && a.labor.counted)
        ? '<span class="tag labor">劳动 '+(a.labor.hours||'?')+' 学时</span>' : '';
      var quotaHtml = '';
      if (a.quota){
        var pct = Math.min(100, Math.round((a.applied||0) / a.quota * 100));
        var cls = pct >= 100 ? 'hot' : (pct >= 70 ? 'mid' : '');
        quotaHtml = '<div class="quota"><div class="bar"><i class="'+cls+'" style="width:'+pct+'%"></i></div>'+
          '<div class="txt"><span>已报名 <b>'+(a.applied||0)+'</b> / '+a.quota+' 人</span><span>剩余 '+Math.max(0,a.quota-(a.applied||0))+'</span></div></div>';
      }
      return '<article class="card '+st.c+'" style="animation-delay:'+Math.min(i*25,300)+'ms">'+
        '<div class="date"><div class="d">'+(dd?dd[1]:'—')+'</div><div class="m">'+(mm?mm[1]+'月':'')+'</div></div>'+
        '<div class="body">'+
          '<h2 class="title">'+esc(a.title)+'</h2>'+
          '<div class="tags">'+mineHtml+'<span class="tag '+st.c+'">'+esc(st.t)+'</span>'+
            laborHtml+
            (METHOD[a.method]?'<span class="tag m">'+esc(METHOD[a.method])+'</span>':'')+
            (a.org?'<span class="tag">'+esc(a.org)+'</span>':'')+'</div>'+
          '<div class="meta">'+
            (a.time?'<div><i>时间</i>'+esc(a.date||'')+' '+esc(a.time)+'</div>':'')+
            (a.location?'<div><i>地点</i>'+esc(a.location)+'</div>':'')+
            (a.deadline?'<div><i>截止</i>'+esc(a.deadline)+'</div>':'')+
          '</div>'+
          quotaHtml+
          (a.desc?'<div class="desc">'+esc(a.desc)+'</div>':'')+
          '<a class="go" href="'+esc(a.jumpUrl||a.url||'https://activity.sjtu.edu.cn/dekt')+'" target="_blank" rel="noopener">'+
            (a.jumpUrl?'去外部报名 →':'去报名 →')+'</a>'+
        '</div></article>';
    }).join('');
  }
  render('all');

  // 走局域网服务时：数据一更新就自动刷新（用 file:// 打开时静默失败）
  var cur = D.updatedAt;
  setInterval(function(){
    fetch('/api/version', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(v){
      if (v && v.updatedAt && v.updatedAt !== cur) location.reload();
    }).catch(function(){});
  }, 60000);
  }
})();
</script>
